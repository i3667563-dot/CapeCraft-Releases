# Общие версии инструментов (одинаковые для всех MC-версий).
# Версии Minecraft/loader/fabric/yarn живут в versions/<mc>/gradle.properties.
loom_version=1.17.20
kotlin_version=2.4.20
flk_version=1.14.1+kotlin.2.4.20

# Mod
mod_version=1.2
maven_group=dev.ggtv
archives_base_name=capecraft

# LSP-сервер: собственная версия, независимая от мода. Раньше LSP наследовал
# mod_version, из-за чего обновление редактора требовало пересборки мода.
# Релиз сервера тегается отдельно (lsp-v*), см. .github/workflows/lsp-release.yml.
# Бета: будет дорабатываться, обновления выходят на тех же lsp-v* тегах.
lsp_version=0.1-beta

# Gradle
# Демон Gradle и демон Kotlin — отдельные JVM, и вместе они молча занимали
# 4.5 ГБ: демон Gradle съедал 2 ГБ, а у Kotlin-лимита не было вовсе, и он
# раздувался до 2.5 ГБ. На машине с 15 ГБ это роняло всё остальное в своп.
# Лимиты поставлены так, чтобы сборка шести версий проходила с запасом.
org.gradle.jvmargs=-Xmx2G
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.parallel=true
# Демоны переживают сборку и висят между запусками. Для этого проекта
# выигрыш от их повторного использования не окупает постоянно занятую
# память, поэтому выключаем.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process