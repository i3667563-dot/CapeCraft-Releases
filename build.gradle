buildscript {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${project.loom_version}"
	}
}

plugins {
	// Kotlin применяется всегда; loom — условно ниже (remap для yarn vs no-remap
	// для необфусцированных версий MC), поэтому не в plugins block.
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

// Версия MC выбирается флагом: ./gradlew build -Pmc=1.21.10 (или 26.2).
// Версионные зависимости и исходники живут в versions/<mc>/.
def mc = providers.gradleProperty('mc').getOrElse('26.2')
def verProps = new Properties()
file("versions/${mc}/gradle.properties").withInputStream { verProps.load(it) }

// yarn-версии нужен полный ремап (fabric-loom legacy); необфусцированная
// MC (26.2) — no-remap (net.fabricmc.fabric-loom).
if (verProps.yarn_mappings) {
	apply plugin: 'fabric-loom'
} else {
	apply plugin: 'net.fabricmc.fabric-loom'
}

base {
	archivesName = project.archives_base_name
}

// Живой прогон синхронизации: сервер + два клиента с разными никами.
//
// Клиента нужен не один по двум причинам. Первая — каждому нужна своя папка
// игры: `run/` общая, и два клиента в ней затирают друг другу options.txt и
// логи, а с ними и кэш плащей. Вторая — разный ник: в дев-запуске Loom сам
// никакого `--username` не подставляет, и без него все клиенты приходят как
// Player, а объявление синхронизации адресуется по нику.
//
// Каталоги и ники задаются переменными: их удобно переопределять на запуск
// (`-PtestServer=... -PclientAName=...`), не правя build.gradle.
def testServerDir = providers.gradleProperty('testServer').getOrElse('run-server')
def clientAName = providers.gradleProperty('clientAName').getOrElse('GGSHNIKK')
def clientBName = providers.gradleProperty('clientBName').getOrElse('Eonixx')
def testAddress = providers.gradleProperty('testAddress').getOrElse('127.0.0.1:25599')

loom {
	runs {
		server { runDir = testServerDir }
		client { runDir = 'run-client-a' }
		clientB {
			client()
			runDir = 'run-client-b'
		}
	}
}

// `--quickPlayMultiplayer` вход в сервер без кликов по меню: иначе стенд
// не запускается без рук.
loom.runs.named('client').get().programArgs('--username', clientAName, '--quickPlayMultiplayer', testAddress)
loom.runs.named('clientB').get().programArgs('--username', clientBName, '--quickPlayMultiplayer', testAddress)

// Отдельного таска объявлять не нужно: Loom регистрирует `run<Имя>` на каждый
// run-конфиг, поэтому второй клиент запускается `./gradlew runClientB`.

// Подключить версионные исходники/ресурсы из versions/<mc>.
sourceSets {
	main {
		kotlin.srcDir "versions/${mc}/src/main/kotlin"
		resources.srcDir "versions/${mc}/src/main/resources"
	}
	test {
		kotlin.srcDir "versions/${mc}/src/test/kotlin"
	}
}

// Каждая версия MC собирается в СВОЙ каталог: переключение -Pmc не должно
// смешивать классы и incremental-кэш Kotlin разных версий. Раньше общий
// build/ приводил к ровно этому — после 26.2 сборка 1.21.11 без clean падала
// с «Unresolved reference 'CapeCraftClient'», показывая классы от другой версии.
layout.buildDirectory = layout.projectDirectory.dir("build/${mc}")

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${verProps.minecraft_version}"

	// 1.21.10 — yarn mappings + modImplementation (remap); 26.2 — необфусцирована,
	// без mappings, обычный implementation.
	if (verProps.yarn_mappings) {
		add("mappings", "net.fabricmc:yarn:${verProps.yarn_mappings}:v2")
	}
	def depType = verProps.yarn_mappings ? 'modImplementation' : 'implementation'
	add(depType, "net.fabricmc:fabric-loader:${verProps.loader_version}")
	add(depType, "net.fabricmc.fabric-api:fabric-api:${verProps.fabric_version}")

	// fabric-language-kotlin нужен в ДВУХ видах:
	//
	// 1) Обычная зависимость — чтобы мод компилировался и запускался в дев-режиме
	//    (`./gradlew runClient` / `runServer`). Loom кладёт её в dev-classpath,
	//    и без неё входные точки мода не находятся:
	//      "Mod 'CapeCraft' requires fabric-language-kotlin, which is missing!"
	//
	// 2) include (jar-in-jar) — чтобы в релизном jar лежала собственная копия
	//    и пользователю не надо было ничего качать руками. В проде classpath
	//    не играет роли, всё разруливает загрузчик.
	//
	// Проверено запуском сервера: с одним только `include` дев-запуск падает,
	// поэтому строка на `include` не заменяет строку на `depType`, а дополняет её.
	//
	// Дубль mod id безопасен: загрузчик грузит ОДНУ версию мода — верхнеуровневый
	// jar бьёт вложенный, дальше сравнивается версия. Если у игрока уже стоит
	// свой FLK, выиграет его, а наш вложенный просто не активируется.
	// Поэтому `depends: fabric-language-kotlin` в fabric.mod.json оставляем:
	// вложенная копия это требование закрывает.
	//
	// JiJ двухуровневый: сам FLK — мод с 13 вложенными jar'ами
	// (kotlin-stdlib/reflect, kotlinx-coroutines/serialization, atomicfu);
	// загрузчик рекурсивно обходит вложенные моды, так что это штатно.
	add(depType, "net.fabricmc:fabric-language-kotlin:${verProps.flk_version}")
	add("include", "net.fabricmc:fabric-language-kotlin:${verProps.flk_version}")

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${project.kotlin_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "full"
	}
	// READMEExamplesTest читает README с диска, поэтому правка документации
	// обязана перезапускать тесты. Без этого Gradle считает задачу
	// up-to-date, и проверка примеров молча ничего не проверяет: именно так
	// в документации и жил неразбираемый `when { ... }`.
	inputs.file(file('README.md')).withPropertyName('readmeUnderTest')
}

// --- Сервер LSP для конфигов .kn ------------------------------------------
//
// Живёт в том же проекте, а не в подпроекте, по конкретной причине: общий
// код не компилируется без Minecraft, а Gradle 9 не даёт подпроекту взять
// чужую конфигурацию (`Resolution ... without an exclusive lock`). Отдельный
// проект означал бы либо копию исходников (разойдутся схемы — подсказки
// начнут врать), либо перечисление координат Minecraft вручную (разъедется
// с модом по версии). Здесь classpath уже правильный, потому что это он.
//
// В мод сервер не попадает: jar мода его исключает, сборка — отдельная
// (`./gradlew lspJar`). При этом Minecraft в classpath запуска сервера не
// нужен и в его jar не упаковывается: до классов, связанных с игрой, разбор
// конфига не доходит.
configurations {
	lspRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	// Ровно три jar'а: kotlin-stdlib, slf4j-api и его простой биндинг.
	// simple нужен, чтобы лог общего кода ушёл в stderr, а не потерялся без
	// биндинга: stdout сервера принадлежит протоколу, и лог в нём ломает
	// разбор кадров.
	lspRuntime "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
	lspRuntime 'org.slf4j:slf4j-api:2.0.16'
	lspRuntime 'org.slf4j:slf4j-simple:2.0.16'
}

// Жирный jar: редактор запускает сервер одной командой, и требовать от
// пользователя classpath с kotlin-stdlib — значит гарантированно сломанная
// установка у половины людей. Без плагина-затемнителя: берём распакованное
// содержимое lspRuntime.
tasks.register('lspJar', Jar) {
	group = 'build'
	description = 'Собирает запускаемый сервер LSP: artifacts/capecraft-lsp.jar'
	archiveBaseName = 'capecraft-lsp'
	// Имя без версии — намеренно: путь к серверу живёт в конфиге редактора,
	// и версия в имени заставила бы править его на каждом релизе. Версия
	// остаётся в Implementation-Version внутри манифеста.
	archiveVersion = ''
	archiveClassifier = ''
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest.attributes(
		'Main-Class': 'dev.ggtv.capecraft.lsp.MainKt',
		'Implementation-Title': 'CapeCraft LSP',
		'Implementation-Version': project.mod_version,
	)
	from(sourceSets.main.output)
	from({
		configurations.lspRuntime.filter { it.name.endsWith('.jar') }.collect { zipTree(it) }
	})
	// Служебные файлы подписи и module-info не нужны и ломают сборку при
	// дубликатах (в kotlin-stdlib и slf4j они есть).
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/9/module-info.class'
	// Свой путь, а не общий artifactDir из секции ниже: тот объявлен после
	// этого блока, и ссылка на него отсюда сработала бы только при переносе.
	destinationDirectory = layout.projectDirectory.dir('artifacts')
}

// Сервер в jar мода не едет: игрок получает 30 КБ серверного кода, который
// никогда не грузится, а лишние классы в модe — это лишняя поверхность для
// конфликтов (например, если у игрока есть свой класс с тем же именем).
tasks.named('jar', Jar) {
	exclude 'dev/ggtv/capecraft/lsp/**'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

// Публикация собранного jar в artifacts/ под стабильным именем
// capecraft-<version>-<mc>.jar.
//
// Зачем: сборка писала только в build/<mc>/libs/, а artifacts/ оставался от
// прошлого раза молча. Именно так в mods/ попал jar трёхнедельной давности
// без StackedPngDecoder: мод запускался, показывал плащ и растягивал стек на
// всю текстуру, а сборка при этом была «успешной». Ставить нужно артефакт
// свежей сборки, поэтому он публикуется автоматически и не может устареть.
def artifactDir = layout.projectDirectory.dir('artifacts')
def artifactName = "capecraft-${project.mod_version}-${mc}.jar"

tasks.register('publishArtifact') {
	group = 'build'
	description = "Копирует собранный jar в artifacts/${artifactName}"

	doLast {
		def libs = layout.buildDirectory.dir('libs').get().asFile
		// Основной выход: <archives_base_name>-<version>.jar. У yarn-версий
		// loom может добавить классификатор, поэтому берём первый же jar без
		// -sources, но только если он один — иначе молча угадывать нельзя.
		def sources = new File(libs, "${project.archives_base_name}-${project.version}.jar")
		def candidates = (libs.listFiles() ?: []).findAll {
			it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar') &&
				!it.name.endsWith('-dev.jar') && !it.name.endsWith('-javadoc.jar')
		}
		def src = candidates.size() == 1 ? candidates.first() : sources
		if (src == null || !src.isFile()) {
			throw new GradleException(
				"Не найден jar для публикации в ${libs}. Найдено: ${candidates*.name}")
		}
		artifactDir.asFile.mkdirs()
		def out = new File(artifactDir.asFile, artifactName)
		out.bytes = src.bytes
		logger.lifecycle("jar → artifacts/${artifactName} (из ${src.name})")
	}
}

tasks.named('assemble') { finalizedBy('publishArtifact') }

// `clean` базового плагина чистит только build/<mc> (см. buildDirectory выше).
// cleanAll — снести выходы сразу всех версий.
tasks.register('cleanAll', Delete) {
	delete layout.projectDirectory.dir('build')
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
	it.options.compilerArgs.add('-Xlint:deprecation')
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = '21'
		allWarningsAsErrors = false
	}
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(verProps.java_version as int)
	}
}