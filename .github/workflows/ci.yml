name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 1.21.1
            java: 21
          - mc: 1.21.4
            java: 21
          - mc: 1.21.8
            java: 21
          - mc: 1.21.10
            java: 21
          - mc: 1.21.11
            java: 21
          - mc: 26.2
            java: 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (${{ matrix.mc }})
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Rename artifact with MC version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mv build/libs/capecraft-${version}.jar build/libs/capecraft-${version}-${{ matrix.mc }}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: capecraft-${{ matrix.mc }}
          path: build/libs/capecraft-*-${{ matrix.mc }}.jar
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect jars into one dir
        run: |
          mkdir -p release
          find artifacts -name 'capecraft-*.jar' -exec cp {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "CapeCraft ${{ steps.meta.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## CapeCraft ${{ steps.meta.outputs.version }}

            Кастомные анимированные плащи для Minecraft 1.21.1 / 1.21.4 / 1.21.8 / 1.21.10 / 1.21.11 / 26.2 (Fabric).

            ### Установка
            1. Установи [Fabric Loader](https://fabricmc.net/) для своей версии Minecraft
            2. Скопируй нужный `capecraft-${{ steps.meta.outputs.version }}-<версия>.jar` в папку `mods/`
            3. Запусти игру

            ### Поддерживаемые форматы
            PNG • APNG • GIF • WebP (lossless)

            ### Конфигурация
            `config/capecraft.kn` — создаётся автоматически при первом запуске.
            См. [README](https://github.com/${{ github.repository }}/blob/main/README.md) для подробностей.
          files: release/*.jar
          draft: false
          prerelease: false