name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 1.21.1
            java: 21
          - mc: 1.21.4
            java: 21
          - mc: 1.21.8
            java: 21
          - mc: 1.21.10
            java: 21
          - mc: 1.21.11
            java: 21
          - mc: 26.2
            java: 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (${{ matrix.mc }})
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: capecraft-${{ matrix.mc }}
          # Ничего переименовывать не нужно: assemble уже finalizedBy
          # publishArtifact, и jar лежит в artifacts/capecraft-<version>-<mc>.jar.
          # Раньше здесь стоял `mv build/libs/capecraft-<version>.jar`, но сборка
          # пишет в build/<mc>/libs/ — пути не существовало, и CI падал после
          # успешной сборки (так сломался и прогон 1.1.0).
          path: artifacts/capecraft-*-*.jar
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect jars into one dir
        run: |
          mkdir -p release
          find artifacts -name 'capecraft-*.jar' -exec cp {} release/ \;
          ls -la release/

      - name: Check release notes exist
        run: |
          notes="release-notes/${{ steps.meta.outputs.version }}.md"
          # Без этой проверки релиз выходит с пустым описанием, и заметки
          # про синхронизацию молча теряются.
          test -s "$notes" || { echo "::error::нет заметок релиза: $notes"; exit 1; }
          echo "заметки релиза: $notes"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "CapeCraft ${{ steps.meta.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          # Тело релиза берётся из файла, а не из этого workflow:
          # зашитый текст всегда расходился с реальным составом версий.
          body_path: release-notes/${{ steps.meta.outputs.version }}.md
          files: release/*.jar
          draft: false
          prerelease: false